# ============================================================
#  CONFIGURACIÓN DEL INFORME  (es el único archivo que tienes
#  que tocar; todo lo demás es el motor)
# ============================================================
zona_horaria: Europe/Madrid

# Marca del informe (aparece en portada y pies). Cámbiala a tu gusto.
marca: Radar del mercado eléctrico
autor: ""                     # p. ej. tu nombre; vacío = no se muestra

# Batería de referencia para el "techo teórico" de arbitraje
bateria:
  horas: 4                    # duración (MWh por cada MW)
  rendimiento_ida_vuelta: 0.85
  coste_ciclado_eur_mwh: 4.0  # igual que el UNEF BESS Index
  ciclos_max_dia: 1.5         # tope de descarga diaria (en veces la capacidad)

# Si el precio spot de la semana tiene menos cobertura, no se publica
umbral_cobertura_spot: 0.98

# ---------- Series OBLIGATORIAS / ya identificadas ----------
# 600  = precio mercado spot diario
# 1293 / 544 / 545 = demanda real / prevista / programada
#   (son los indicadores que cita el propio informe de UNEF)
series:
  spot:
    id: 600
    nombre: Mercado diario
    unidad: €/MWh
    geo: [3, 8741]            # 3 = España, 8741 = Península
    palabras: [spot]          # se avisa si el nombre del indicador no las contiene
  demanda_real:
    id: 1293
    nombre: Demanda real
    unidad: MW
    palabras: [demanda]
  demanda_prevista:
    id: 544
    nombre: Demanda prevista
    unidad: MW
    palabras: [demanda]
  demanda_programada:
    id: 545
    nombre: Demanda programada
    unidad: MW
    palabras: [demanda]

# ---------- Series OPCIONALES ----------
# id: null  -> la serie no se usa y sus diapositivas no aparecen.
# provisional: true -> el ID es una suposición: si el nombre real del indicador
#   no contiene las `palabras`, la serie se descarta (y se avisa en el informe).
# Para completar los IDs: Actions -> "Volcar indicadores" genera
# data/indicadores_esios.csv con todos los indicadores; ahí buscas cada nombre.
# tipo: precio (€/MWh) | potencia (MW, generación) | energia (MW casados)
#       banda_precio (€/MW) | banda_mw (MW)
opcionales:
  gen_solar_fv:    {id: 1295, provisional: true, palabras: [fotovoltaica], nombre: Generación solar FV, unidad: MW, tipo: potencia}
  gen_eolica:      {id: 551,  provisional: true, palabras: [eolica], nombre: Generación eólica, unidad: MW, tipo: potencia}
  ida1:            {id: 612,  provisional: true, palabras: [intradiario], nombre: Intradiario IDA1, unidad: €/MWh, tipo: precio}
  ida2:            {id: 613,  provisional: true, palabras: [intradiario], nombre: Intradiario IDA2, unidad: €/MWh, tipo: precio}
  ida3:            {id: 614,  provisional: true, palabras: [intradiario], nombre: Intradiario IDA3, unidad: €/MWh, tipo: precio}
  continuo:        {id: 1727, provisional: true, palabras: [continuo], nombre: Intradiario continuo (referencia), unidad: €/MWh, tipo: precio}
  afrr_subir:      {id: 682, provisional: true, palabras: [secundaria], nombre: aFRR energía a subir, unidad: €/MWh, tipo: precio}
  afrr_bajar:      {id: 683, provisional: true, palabras: [secundaria], nombre: aFRR energía a bajar, unidad: €/MWh, tipo: precio}
  mfrr_subir:      {id: 2197, provisional: true, palabras: [mfrr], nombre: mFRR precio (activación programada), unidad: €/MWh, tipo: precio}
  # Las series de tipo energia vienen de ESIOS en MWh por periodo; src/esios.py las pasa a MW medios
  # (x4 en las cuartohorarias), igual que UNEF. Las de 5 minutos (demanda, generación) se promedian.
  mfrr_bajar:      {id: null, nombre: mFRR precio medio a bajar, unidad: €/MWh, tipo: precio}
  # Banda aFRR: 2130/634 (precio) y 632/633 (asignada) son las que usa UNEF y cuadran al decimal con
  # su tabla. Desde el 25-oct-2026 ESIOS dejó de publicarlas; el respaldo 10388/10463 vale lo mismo
  # hasta el 24-oct pero desde el 25-oct publica cifras que no son €/MW (decenas de miles): esos
  # días se descartan con max_valido. La asignada no tiene respaldo: el requerimiento (630/631) va aparte.
  # Del 25-oct al 4-nov-2026 ESIOS no publicó 2130/634/632/633 y el 10388 llevaba exactamente el coste de
  # la reserva (ID 712/899, €). Último recurso: precio ≈ coste (712/2127) ÷ banda requerida (630/631), marcado
  # como estimado (error medio < 1 % frente a 2130/634 del 5 al 8-nov). Desde el 5-nov vuelven las oficiales.
  afrr_banda_p_subir: {id: 2130, respaldo: 10388, max_valido: 1000, estimar: {coste: 712, banda: 630}, provisional: true, palabras: [reserva], nombre: aFRR banda a subir, unidad: €/MW, tipo: banda_precio}
  afrr_banda_p_bajar: {id: 634, respaldo: 10463, max_valido: 1000, estimar: {coste: 2127, banda: 631}, provisional: true, palabras: [reserva], nombre: aFRR banda a bajar, unidad: €/MW, tipo: banda_precio}
  afrr_banda_subir:   {id: 632, provisional: true, palabras: [reserva], nombre: Banda aFRR asignada a subir, unidad: MW, tipo: banda_mw}
  afrr_banda_bajar:   {id: 633, provisional: true, palabras: [reserva], nombre: Banda aFRR asignada a bajar, unidad: MW, tipo: banda_mw}
  afrr_req_subir:     {id: 630, provisional: true, palabras: [reserva], nombre: Banda aFRR requerida a subir, unidad: MW, tipo: banda_mw}
  afrr_req_bajar:     {id: 631, provisional: true, palabras: [reserva], nombre: Banda aFRR requerida a bajar, unidad: MW, tipo: banda_mw}
  casada_diario:   {id: 602, provisional: true, palabras: [diario], nombre: Energía casada mercado diario, unidad: MW, tipo: energia}
  casada_ida1:     {id: 605, provisional: true, palabras: [intradiario], nombre: Energía casada IDA1, unidad: MW, tipo: energia}
  casada_ida2:     {id: 606, provisional: true, palabras: [intradiario], nombre: Energía casada IDA2, unidad: MW, tipo: energia}
  casada_ida3:     {id: 607, provisional: true, palabras: [intradiario], nombre: Energía casada IDA3, unidad: MW, tipo: energia}
  casada_continuo: {id: 1442, provisional: true, palabras: [continuo], nombre: Energía casada continuo, unidad: MW, tipo: energia}
  afrr_energia_act_subir: {id: 680, provisional: true, palabras: [secundaria], nombre: aFRR energía activada a subir, unidad: MW, tipo: energia_balance}
  afrr_energia_act_bajar: {id: 681, provisional: true, palabras: [secundaria], nombre: aFRR energía activada a bajar, unidad: MW, tipo: energia_balance}
  mfrr_asig_subir: {id: 675, provisional: true, palabras: [mfrr], nombre: mFRR asignación a subir (AP), unidad: MW, tipo: energia_balance}
  mfrr_asig_bajar: {id: 674, provisional: true, palabras: [mfrr], nombre: mFRR asignación a bajar (AP), unidad: MW, tipo: energia_balance}

# ---------- Mix de generación peninsular en tiempo real (MW, 5 min) ----------
# Comprobado (semana 44): generación + intercambios + enlace balear + baterías cierra con la demanda
# real con un -0,7 %. La hidráulica (546) viene en NETO con el bombeo: src/analisis.py le resta la
# turbinación (2079) y el consumo de bombeo (2078) para obtener la hidráulica convencional (renovable).
mix:
  hidraulica: {id: 546,  nombre: Hidráulica, renovable: true}
  eolica:     {id: 551,  nombre: Eólica, renovable: true}
  solar_fv:   {id: 1295, nombre: Solar fotovoltaica, renovable: true}
  solar_ter:  {id: 1294, nombre: Solar térmica, renovable: true}
  term_ren:   {id: 1296, nombre: Térmica renovable, renovable: true}
  nuclear:    {id: 549,  nombre: Nuclear, renovable: false}
  ciclo:      {id: 550,  nombre: Ciclo combinado, renovable: false}
  carbon:     {id: 547,  nombre: Carbón, renovable: false}
  fuel_gas:   {id: 548,  nombre: Fuel-gas, renovable: false}
  cogen:      {id: 1297, nombre: Cogeneración y resto, renovable: false}
  vapor:      {id: 2344, nombre: Turbina de vapor, renovable: false}
# Flujos que no son generación (se analizan aparte)
balance:
  turb_bombeo:   {id: 2079, nombre: Turbinación bombeo}
  cons_bombeo:   {id: 2078, nombre: Consumo bombeo}
  intercambios:  {id: 553,  nombre: Saldo de intercambios internacionales}
  enlace_balear: {id: 554,  nombre: Enlace balear}
  bat_carga:     {id: 2166, nombre: Baterías · carga}
  bat_entrega:   {id: 2167, nombre: Baterías · entrega}

# ---------- Semáforos de «Señales de la semana» (convenciones de este informe, no estándares) ----------
semaforos:
  captura_fv_pct: [70, 85]          # < 70 rojo · 70-85 ámbar · > 85 verde
  techo_var_pct: 10                 # ± % frente a la media de 4 semanas
  spread_eur_mwh: [60, 120]         # < 60 rojo · 60-120 ámbar · > 120 verde
  intradiario_uplift_pct: [8, 20]   # < 8 rojo · 8-20 ámbar · > 20 verde
  prima_afrr_eur_mwh: [8, 25]       # < 8 rojo · 8-25 ámbar · > 25 verde
  mape_demanda_pct: [1.5, 3]        # < 1,5 verde · 1,5-3 ámbar · > 3 rojo
  horas_neg_h: [3, 15]              # < 3 verde · 3-15 ámbar · > 15 rojo

# ---------- Control de calidad automático (src/validacion.py) ----------
validacion:
  precio_eur_mwh: 0.01              # ESIOS 600/612-614 frente a OMIE, cuarto a cuarto
  tiempo_real_pct: 1.0              # ESIOS tiempo real frente a demanda.ree.es (diferencia media / nivel medio)
  cascada_i3_pct: 0.1               # cierre de la cascada del I3 contra el P48
  rendimiento_baterias_pct: [70, 95]

# ---------- Cifras oficiales externas (dato ESTÁTICO: se citan, no se recalculan) ----------
oficiales_operacion_reforzada:
  - cifra: "3.347 M€"
    concepto: "Coste total de las restricciones técnicas en 2025; la operación reforzada fue «una parte menor»"
    fuente: "REE, nota de prensa de 23/07/2026 (ree.es, 2307_NP_RRTT_2026.pdf)"
    consulta: "2026-11-09"
  - cifra: "516 M€"
    concepto: "Coste de la operación reforzada, mayo-diciembre de 2025"
    fuente: "CNMC con datos de REE (recogido en prensa, roams.es)"
    consulta: "2026-11-09"
  - cifra: "275 M€"
    concepto: "Coste de la operación reforzada, enero-septiembre de 2026"
    fuente: "CNMC con datos de REE (recogido en prensa, roams.es)"
    consulta: "2026-11-09"
