# ============================================================
#  CONFIGURACIÓN DEL INFORME  (es el único archivo que tienes
#  que tocar; todo lo demás es el motor)
# ============================================================
zona_horaria: Europe/Madrid

# Marca del informe (aparece en portada y pies). Cámbiala a tu gusto.
marca: Radar del mercado eléctrico
autor: ""                     # p. ej. tu nombre; vacío = no se muestra

# Batería de referencia para el "techo teórico" de arbitraje
bateria:
  horas: 4                    # duración (MWh por cada MW)
  rendimiento_ida_vuelta: 0.85
  coste_ciclado_eur_mwh: 4.0  # igual que el UNEF BESS Index
  ciclos_max_dia: 1.5         # tope de descarga diaria (en veces la capacidad)

# Si el precio spot de la semana tiene menos cobertura, no se publica
umbral_cobertura_spot: 0.98

# ---------- Series OBLIGATORIAS / ya identificadas ----------
# 600  = precio mercado spot diario
# 1293 / 544 / 545 = demanda real / prevista / programada
#   (son los indicadores que cita el propio informe de UNEF)
series:
  spot:
    id: 600
    nombre: Mercado diario
    unidad: €/MWh
    geo: [3, 8741]            # 3 = España, 8741 = Península
    palabras: [spot]          # se avisa si el nombre del indicador no las contiene
  demanda_real:
    id: 1293
    nombre: Demanda real
    unidad: MW
    palabras: [demanda]
  demanda_prevista:
    id: 544
    nombre: Demanda prevista
    unidad: MW
    palabras: [demanda]
  demanda_programada:
    id: 545
    nombre: Demanda programada
    unidad: MW
    palabras: [demanda]

# ---------- Series OPCIONALES ----------
# id: null  -> la serie no se usa y sus diapositivas no aparecen.
# provisional: true -> el ID es una suposición: si el nombre real del indicador
#   no contiene las `palabras`, la serie se descarta (y se avisa en el informe).
# Para completar los IDs: Actions -> "Volcar indicadores" genera
# data/indicadores_esios.csv con todos los indicadores; ahí buscas cada nombre.
# tipo: precio (€/MWh) | potencia (MW, generación) | energia (MW casados)
#       banda_precio (€/MW) | banda_mw (MW)
opcionales:
  gen_solar_fv:    {id: 1295, provisional: true, palabras: [fotovoltaica], nombre: Generación solar FV, unidad: MW, tipo: potencia}
  gen_eolica:      {id: 551,  provisional: true, palabras: [eolica], nombre: Generación eólica, unidad: MW, tipo: potencia}
  ida1:            {id: 612,  provisional: true, palabras: [intradiario], nombre: Intradiario IDA1, unidad: €/MWh, tipo: precio}
  ida2:            {id: 613,  provisional: true, palabras: [intradiario], nombre: Intradiario IDA2, unidad: €/MWh, tipo: precio}
  ida3:            {id: 614,  provisional: true, palabras: [intradiario], nombre: Intradiario IDA3, unidad: €/MWh, tipo: precio}
  continuo:        {id: 1727, provisional: true, palabras: [continuo], nombre: Intradiario continuo (referencia), unidad: €/MWh, tipo: precio}
  afrr_subir:      {id: 682, provisional: true, palabras: [secundaria], nombre: aFRR energía a subir, unidad: €/MWh, tipo: precio}
  afrr_bajar:      {id: 683, provisional: true, palabras: [secundaria], nombre: aFRR energía a bajar, unidad: €/MWh, tipo: precio}
  mfrr_subir:      {id: 2197, provisional: true, palabras: [mfrr], nombre: mFRR precio (activación programada), unidad: €/MWh, tipo: precio}
  mfrr_bajar:      {id: null, nombre: mFRR precio medio a bajar, unidad: €/MWh, tipo: precio}
  afrr_banda_p_subir: {id: 10388, provisional: true, palabras: [reserva], nombre: aFRR banda a subir, unidad: €/MW, tipo: banda_precio}
  afrr_banda_p_bajar: {id: 10463, provisional: true, palabras: [reserva], nombre: aFRR banda a bajar, unidad: €/MW, tipo: banda_precio}
  afrr_banda_subir:   {id: 630, provisional: true, palabras: [reserva], nombre: Banda aFRR requerida a subir, unidad: MW, tipo: banda_mw}
  afrr_banda_bajar:   {id: 631, provisional: true, palabras: [reserva], nombre: Banda aFRR requerida a bajar, unidad: MW, tipo: banda_mw}
  casada_diario:   {id: 602, provisional: true, palabras: [diario], nombre: Energía casada mercado diario, unidad: MW, tipo: energia}
  casada_ida1:     {id: 605, provisional: true, palabras: [intradiario], nombre: Energía casada IDA1, unidad: MW, tipo: energia}
  casada_ida2:     {id: 606, provisional: true, palabras: [intradiario], nombre: Energía casada IDA2, unidad: MW, tipo: energia}
  casada_ida3:     {id: 607, provisional: true, palabras: [intradiario], nombre: Energía casada IDA3, unidad: MW, tipo: energia}
  casada_continuo: {id: 1442, provisional: true, palabras: [continuo], nombre: Energía casada continuo, unidad: MW, tipo: energia}
  afrr_energia_act_subir: {id: 680, provisional: true, palabras: [secundaria], nombre: aFRR energía activada a subir, unidad: MW, tipo: energia}
  afrr_energia_act_bajar: {id: 681, provisional: true, palabras: [secundaria], nombre: aFRR energía activada a bajar, unidad: MW, tipo: energia}
  mfrr_asig_subir: {id: 675, provisional: true, palabras: [mfrr], nombre: mFRR asignación a subir (AP), unidad: MW, tipo: energia}
  mfrr_asig_bajar: {id: 674, provisional: true, palabras: [mfrr], nombre: mFRR asignación a bajar (AP), unidad: MW, tipo: energia}
