# BESS stand-alone 50 MW / 4 h con supuestos realistas propios: como «C operable» (previsión imperfecta,
# diario antes que banda, continuo, ofertas de energía a coste de oportunidad) y además con profundidad de
# mercado (Modo v0.5) en banda aFRR y mFRR: tope del 30 % de la potencia en banda y umbral del 1 %.
nombre: "Realista 50 MW/4 h · previsión imperfecta y profundidad"
activo:
  p_bess_mw: 50
  e_bess_mwh: 200
  p_poi_mw: 50
  p_poi_import_mw: 50
  fv_mwp: 0
  carga_desde_red: true
normalizar_por: bess
prevision: {modo: imperfecta}
mercados:
  banda_secuencial: true
  intradiario: false
  continuo: true
  activacion_racional: true
  reposicion_fisica: true
