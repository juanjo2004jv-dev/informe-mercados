# Variante de C con el orden real de cierre de los mercados: primero el diario (cierre 12:00 de D-1) y
# después la reserva aFRR sobre la potencia y la energía que quedan (ofertas hasta las 16:00 de D-1).
# Cota conservadora: supone que el diario se oferta sin anticipar el precio de la banda.
# Fuentes: REE, «Ser proveedor de servicios de ajuste» (dic-2024), apartado de reserva aFRR; OMIE (hora de cierre del diario).
nombre: "C · secuencial: diario antes que banda"
activo:
  p_bess_mw: 50
  e_bess_mwh: 200
  p_poi_mw: 50
  p_poi_import_mw: 50
  fv_mwp: 0
  carga_desde_red: true
normalizar_por: bess
mercados:
  banda_secuencial: true
profundidad:
  afrr_banda: {activa: false}
