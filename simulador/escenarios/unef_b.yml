# Réplica del escenario B del UNEF BESS Index: FV 50 MW + BESS 50 MW / 4 h, CON carga desde red
nombre: "B · FV 50 MW + BESS 50 MW/4 h con carga de red"
activo:
  p_bess_mw: 50
  e_bess_mwh: 200
  p_poi_mw: 50
  p_poi_import_mw: 50
  fv_mwp: 65              # 50 MW de acceso con DC/AC 1,3: diseño de mínimo LCOE con seguidor en España
  fv_ratio_dc_ac: 1.3     # (TFM Comillas, Higuera; TFG Comillas, Cortajarena: planta en Extremadura con 1,3)
  # UNEF usa un perfil FV real de Badajoz (acta del GT de 22-10-2026). Aproximación: energía mensual de PVGIS
  # en Badajoz con seguidor de un eje (SUPUESTO: UNEF no dice si es fijo o seguidor) y forma real peninsular.
  # VERIFICADO 26-nov-2026 (8 puntos de validación de A y B): error medio absoluto 4,1 % con DC/AC 1,3 frente a
  # 5,4 % con 1,0 (criterio fijado antes de comparar; no se ajusta ningún valor intermedio).
  emplazamiento: {lat: 38.879, lon: -6.970, seguidor: true, perdidas: 14}
  carga_desde_red: true
normalizar_por: poi
# Banda aFRR precio-aceptante (sin tope de profundidad): con el tope de Modo la banda sale al 35-45 % de
# la de UNEF (jul-sep 2026).
# Orden real de cierre: diario primero (cierre 12:00 de D-1) y reserva aFRR después (ofertas hasta las
# 16:00 de D-1; REE, «Ser proveedor de servicios de ajuste»). VERIFICADO 23-nov-2026: con este orden el
# total anual 2025 queda a −0,1 % (A), −1,4 % (B) y −0,8 % (C) de UNEF, frente a +3,1 %, +8,9 % y +13,9 %
# co-optimizando diario y banda con previsión perfecta (escenario c_techo). Sin parámetros ajustados.
mercados:
  banda_secuencial: true
profundidad:
  afrr_banda: {activa: false}
