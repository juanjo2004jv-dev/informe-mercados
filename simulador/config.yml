# Simulador de escenarios BESS · parámetros por defecto
# Cada escenario (simulador/escenarios/*.yml) puede sobrescribir cualquier clave.
# Todo lo que no está verificado lleva la marca SUPUESTO.

# ---------------------------------------------------------------------------
# Series de ESIOS (IDs verificados en data/indicadores_esios.csv)
# unidad: precio (€/MWh), banda_precio (€/MW por hora), mw (potencia o energía/periodo -> MW medios)
# respaldo: ID alternativo si el principal no tiene dato ese periodo
# ---------------------------------------------------------------------------
series:
  da:          {id: 600,  unidad: precio, nombre: Precio mercado diario}
  ida1:        {id: 612,  unidad: precio, nombre: Precio IDA1}
  ida2:        {id: 613,  unidad: precio, nombre: Precio IDA2}
  ida3:        {id: 614,  unidad: precio, nombre: Precio IDA3}
  cont:        {id: 1727, unidad: precio, nombre: Precio de referencia del continuo}
  cont_mw:     {id: 1442, unidad: mw,     nombre: Energía asignada en el continuo}
  bp_sub:      {id: 2130, respaldo: 10388, unidad: banda_precio, nombre: Precio banda aFRR a subir}
  bp_baj:      {id: 634,  respaldo: 10463, unidad: banda_precio, nombre: Precio banda aFRR a bajar}
  banda_sub:   {id: 632,  unidad: mw, nombre: Banda aFRR asignada a subir}
  banda_baj:   {id: 633,  unidad: mw, nombre: Banda aFRR asignada a bajar}
  req_sub:     {id: 630,  unidad: mw, nombre: Banda aFRR requerida a subir}
  req_baj:     {id: 631,  unidad: mw, nombre: Banda aFRR requerida a bajar}
  coste_sub:   {id: 712,  unidad: precio, nombre: Coste banda aFRR a subir (para estimar huecos)}
  coste_baj:   {id: 2127, unidad: precio, nombre: Coste banda aFRR a bajar (para estimar huecos)}
  pe_sub:      {id: 682,  unidad: precio, nombre: Precio energía aFRR a subir}
  pe_baj:      {id: 683,  unidad: precio, nombre: Precio energía aFRR a bajar}
  act_sub:     {id: 680,  unidad: mw, nombre: Energía aFRR activada a subir}
  act_baj:     {id: 681,  unidad: mw, nombre: Energía aFRR activada a bajar}
  pm:          {id: 2197, unidad: precio, nombre: Precio energías de balance mFRR}
  m_sub:       {id: 10395, respaldo: 675, unidad: mw, nombre: mFRR asignada a subir}
  m_baj:       {id: 10394, respaldo: 674, unidad: mw, nombre: mFRR asignada a bajar}
  rt2_p_sub:   {id: 707, unidad: precio, nombre: Precio restricciones fase II a subir}
  rt2_p_baj:   {id: 708, unidad: precio, nombre: Precio restricciones fase II a bajar}
  rt2_e_sub:   {id: 703, unidad: mw, nombre: Energía restricciones fase II a subir}
  rt2_e_baj:   {id: 704, unidad: mw, nombre: Energía restricciones fase II a bajar}
  fv_nac:      {id: 1295, unidad: mw, nombre: Generación solar FV peninsular (perfil)}

# ---------------------------------------------------------------------------
# Activo por defecto (se sobrescribe en cada escenario)
# ---------------------------------------------------------------------------
activo:
  p_bess_mw: 50          # potencia del BESS en el punto de conexión
  e_bess_mwh: 200        # energía útil
  p_poi_mw: 50           # capacidad de acceso (inyección)
  p_poi_import_mw: 50    # capacidad de consumo desde red
  eta_carga: 0.938       # SUPUESTO: sqrt(0,88); RTE 88 % AC-AC como Modo
  eta_descarga: 0.938
  ciclos_max_dia: 2.0    # SUPUESTO: igual que Modo (ME vBESS ES)
  soc_inicial: 0.0       # fracción de E a las 00:00 (Modo: 0)
  soc_continuo: false    # true: el SoC final de un día es el inicial del siguiente
  fv_mwp: 0              # potencia FV (MWp DC); 0 = stand-alone
  fv_ratio_dc_ac: 1.0    # MWp / MW inversor
  carga_desde_red: true

# ---------------------------------------------------------------------------
# Mercados y reglas
# ---------------------------------------------------------------------------
mercados:
  diario: true
  afrr_banda: true
  afrr_activacion: true
  mfrr: true
  intradiario: true      # etapa 2: IDA1, IDA2 e IDA3 en secuencia, cada una en los cuartos que cubre
  rrtt_fase2: false      # aún no (UNEF no lo incluye)
  banda_horaria: auto    # auto: horaria solo si el precio de banda no cambia dentro de la hora
                         # (VERIFICADO: en jul-sep 2026 cambia en el 93 % de las horas -> cuartohoraria)
  tau_afrr_h: 0.25       # el SoC debe cubrir 15 min de entrega: validez del producto 15 min (P.O. 7.2, anexo I) y prueba de habilitación a potencia máxima ≥ 15 min (Condiciones relativas al balance)
  banda_secuencial: false # true: diario primero y banda después (orden real de cierre); false: co-optimización con previsión perfecta (cota superior)
  coste_ciclado_eur_mwh: 4.0   # UNEF: diferencial mínimo entre mercados
  ivpee: 0.0             # 0,07 = 7 % sobre ventas (desactivado, igual que Modo)
  reposicion: continuo   # la energía activada se repone en el continuo
  reposicion_horizonte_h: 2   # SUPUESTO: al precio medio del continuo de las 2 h siguientes
  continuo: false        # true: arbitraje en el continuo (MIC) en ventanas móviles con el precio de referencia (ESIOS 1727)
  continuo_ventana_h: 2  # ventana de previsión perfecta en tiempo real (Modo, ME BESS ES: ventanas móviles de 2 h)
  continuo_cuota: 1.0    # tope de volumen = cuota × energía casada en el continuo en el cuarto (ESIOS 1442), y nunca > 2 P (Modo)
  activacion_racional: false   # true: oferta de energía aFRR a su coste de oportunidad; sin activaciones con pérdida
  reposicion_fisica: false     # true: activaciones dentro del balance de SoC y reposición causal en el continuo
  reposicion_retardo_h: 1.0    # el continuo cierra 60 min antes de la entrega (excepción aprobada por la CNMC hasta 2029)

# Previsión con la que se DECIDE (siempre se cobra el precio publicado).
#   perfecta: conoce los precios del día (cota superior, como UNEF y Modo).
#   imperfecta: diario y banda con la media cuarto a cuarto de los 7 días anteriores; intradiario con el
#   diferencial IDA − diario previsto igual. Elegido con 2025 y comprobado fuera de muestra en 2026
#   (captura del arbitraje en el diario: 92,9 % y 95,7 % del techo).
prevision: {modo: perfecta, metodo: media, dias: 7}

# Profundidad de mercado (fórmula pública de Modo, v0.5): P_eff = T(1+ln(P/T)) si P > T;
# tope_t = min(P_eff * V_t / D, techo * P). activa: false = precio-aceptante (lo que reproduce a UNEF
# en la banda aFRR, verificado en jul-sep 2026).
profundidad:
  afrr_banda: {activa: true, D_sub: 2180, D_baj: 2430, umbral: 0.01, techo: 0.30}
  mfrr:       {activa: true, D_sub: 1650, D_baj: 825,  umbral: 0.002, techo: 1.0}

# Normalización de resultados
normalizar_por: bess     # bess | poi

# Garantías de origen (solo escenarios con FV). Volumen: CNMC, resolución CNS/DE/1467/24 (30-4-2025): energía
# inyectada en la frontera con la red menos la que el almacenamiento tomó de la red, ajustada por pérdidas.
# Precio: subastas de GdO de OMIP (lotes solares), media de los lotes cuyo periodo de producción cubre el mes:
# 36.ª (8-7-2026) mar-may 1,45; 37.ª (9-9-2026) ene-jul 1,65; 38.ª (11-11-2026) feb-sep 1,58 €/MWh.
# Desde ene-2026 (sin precio público de 2025 a mano; UNEF añadió la GdO en feb-2026). Meses posteriores al
# último publicado: último precio conocido (SUPUESTO).
gdo:
  activa: true
  desde: "2026-01"
  precios: {"2026-01": 1.65, "2026-02": 1.615, "2026-03": 1.56, "2026-04": 1.56, "2026-05": 1.56,
            "2026-06": 1.615, "2026-07": 1.615, "2026-08": 1.58, "2026-09": 1.58}

# ---------------------------------------------------------------------------
# Finanzas (finanzas.py): rentabilidad de los escenarios stand-alone. Euros nominales, por MW de BESS.
# ---------------------------------------------------------------------------
finanzas:
  # CAPEX llave en mano: ACER, encuesta de recursos de generación 2030 (consulta PC-2026-E-04), España, Li-ion 4 h:
  # 547 €/kW. Reparto potencia/energía de NREL (Cole, Ramasamy y Turan, 2025, NREL/TP-6A40-93281): $372/kW +
  # $241/kWh, es decir, el 28 % del coste de un 4 h es de potencia. 152 + 4 × 98,75 = 547 €/kW.
  # Contraste: BNEF 2025, llave en mano en Europa US$177/kWh; Capstone (nov-2025) 90-100 €/kWh instalado.
  capex: {potencia_eur_kw: 152, energia_eur_kwh: 98.75}
  opex_fijo_eur_kw_ano: 15     # ACER (misma encuesta), España, 4 h
  vida_anos: 15                # ACER y NREL
  wacc: 0.109                  # ACER, España, baterías (antes del impuesto de sociedades)
  inflacion: 0.02              # SUPUESTO: objetivo del BCE, aplicado a ingresos y O&M
  impuesto_sociedades: 0.25    # Ley 27/2014, art. 29; amortización lineal en la vida útil (SUPUESTO)
  ivpee: 0.07                  # Ley 15/2012: 7 % del importe de la energía incorporada al sistema (aquí, ventas de la
                               # descarga = MWh vertidos × precio medio de descarga). Doble imposición del
                               # almacenamiento en debate: con ivpee 0 se ve el efecto.
  peaje_generacion_eur_mwh: 0.5  # RD 1544/2011 (la energía que se repone está exenta de peajes de acceso: Circular CNMC 3/2020)
  # Degradación LFP: 1 %/año de calendario + 3 % por cada 1.000 ciclos equivalentes (garantías de 10.000-12.000
  # ciclos, DNV 2026; SUPUESTO fin de vida al 70 %). Contraste: BESS real de 3 años con 356 ciclos, 1,37 %/año
  # (Politecnico di Torino, J. Energy Storage 2023); el modelo da 1,0 + 0,36 = 1,36 %/año con esos ciclos.
  degradacion: {calendario_pct_ano: 1.0, ciclo_pct_por_1000_efc: 3.0}
  referencia_4h: c_operable    # escenario con el que se traduce la previsión de Modo a un factor de mercado
  trayectorias:
    # base: el ingreso converge en 3 años (2028) a la previsión de Modo para un BESS stand-alone en España
    # (152 k€/MW·año en 2028, versión de jul-2026; en oct-2026 el 4 h sube un 12 % en 2028 y el acumulado
    # 2028-2045 queda plano) y desde ahí se mantiene plano en términos reales. SUPUESTO: se aplica a un 4 h.
    base: {tipo: converge, objetivo_eur_mw_ano: 152000, anos: 3}
    persistencia: {tipo: plana}              # se repite el año simulado (cota optimista)
    # saturación: como la base y, desde 2028, −5 %/año real (SUPUESTO; Modo, abr-2026: servicios de ajuste e
    # intradiario saturados para baterías en 2030 con 4,6 GW / 13,6 GWh)
    saturacion: {tipo: converge, objetivo_eur_mw_ano: 152000, anos: 3, deriva_pct_ano: -0.05}
  # Sensibilidad «compra del RtB»: precios de proyectos listos para construir de ~100 k€/MW (Modo, podcast
  # Transmission con nTeaser, 2026). Por defecto 0: se evalúa al promotor que desarrolla el proyecto.
  adquisicion_rtb_eur_kw: 0
