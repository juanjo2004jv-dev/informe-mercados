name: Informe semanal

on:
  schedule:
    # De lunes a sábado a las 06:17 UTC (07:17 en invierno, 08:17 en verano). Minuto 17 y no en punto: a las
    # horas en punto la cola de tareas programadas de GitHub se satura y puede retrasarlas o descartarlas.
    # Lunes: edición provisional con mercados, balance, mix y baterías (el I3 de REE llega a D+4: el del
    # domingo, el jueves). Martes a sábado: si la semana salió provisional y el I3 ya está completo, se
    # regenera entera; si ya está completa, no hace nada. Si el lunes falla, el martes la genera.
    # GitHub no garantiza las ejecuciones programadas (el lunes 9-nov-2026 no lanzó la de las 06:17): hay varias
    # al día como respaldo. Son idempotentes: si la semana ya está publicada, no hacen nada.
    - cron: "17 6 * * 1-6"
    - cron: "43 8 * * 1-6"
    - cron: "29 11 * * 1-6"
    - cron: "11 16 * * 1-6"
    - cron: "45 14 9 11 *"   # prueba única: lunes 9-nov-2026 a las 15:45 (Madrid)
    - cron: "0 15 9 11 *"    # prueba única: lunes 9-nov-2026 a las 16:00 (Madrid)
  workflow_dispatch:
    inputs:
      semana:
        description: "'anterior' o una fecha AAAA-MM-DD de la semana que quieres"
        default: "anterior"
      forzar:
        description: "Regenerar aunque ya exista"
        type: boolean
        default: false
      demo:
        description: "Prueba con datos sintéticos (no usa ESIOS)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write      # para relanzar el reloj si su cadena se cortara

concurrency:
  group: informe
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-24.04   # imagen fijada (la probada el 8-nov-2026); ubuntu-latest migra a Ubuntu 26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generar informe
        id: gen
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
          SEMANA: ${{ inputs.semana || 'anterior' }}
          FORZAR: ${{ inputs.forzar && '--force' || '' }}
          DEMO: ${{ inputs.demo && '--demo' || '' }}
        run: python -m src.run --semana "$SEMANA" $FORZAR $DEMO

      - name: Revisar semanas con precios del I3 pendientes
        # si REE publicó algún día del I3 sin precios, la semana se rehace sola cuando los complete
        if: ${{ github.event_name == 'schedule' || github.actor == 'github-actions[bot]' }}   # programada o lanzada por el reloj
        continue-on-error: true
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
        run: python -m src.run --semana pendientes

      - name: Enviar PDF por correo (opcional)
        if: steps.gen.outputs.pdf != ''
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m src.enviar "${{ steps.gen.outputs.pdf }}"

      - name: Guardar PDF como archivo descargable
        if: steps.gen.outputs.pdf != ''
        uses: actions/upload-artifact@v4
        with:
          name: informe-pdf
          path: ${{ steps.gen.outputs.pdf }}

      - name: Publicar en el repositorio
        if: ${{ always() }}
        run: |
          git config user.name "informe-bot"
          git config user.email "informe-bot@users.noreply.github.com"
          git add docs data
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Informe automático $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "Reintento del push ($i)…"; sleep 10
            done
          fi

      - name: Mantener vivo el reloj
        # el reloj (reloj.yml) es quien lanza este informe a su hora; si no hay ninguno en marcha, se arranca
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "${{ github.repository }}" -w reloj.yml -L 20 --json status -q '[.[] | select(.status != "completed")] | length')
          echo "Relojes en marcha: $n"
          if [ "$n" = "0" ]; then gh workflow run reloj.yml -R "${{ github.repository }}" && echo "Reloj relanzado"; fi
