name: Informe semanal

on:
  schedule:
    # De lunes a sábado a las 06:00 UTC (07:00-08:00 en España).
    # Lunes: edición provisional con mercados, balance, mix y baterías (el I3 de REE llega a D+4: el del
    # domingo, el jueves). Martes a sábado: si la semana salió provisional y el I3 ya está completo, se
    # regenera entera; si ya está completa, no hace nada. Si el lunes falla, el martes la genera.
    - cron: "0 6 * * 1-6"
  workflow_dispatch:
    inputs:
      semana:
        description: "'anterior' o una fecha AAAA-MM-DD de la semana que quieres"
        default: "anterior"
      forzar:
        description: "Regenerar aunque ya exista"
        type: boolean
        default: false
      demo:
        description: "Prueba con datos sintéticos (no usa ESIOS)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: informe
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-24.04   # imagen fijada (la probada el 8-nov-2026); ubuntu-latest migra a Ubuntu 26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generar informe
        id: gen
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
          SEMANA: ${{ inputs.semana || 'anterior' }}
          FORZAR: ${{ inputs.forzar && '--force' || '' }}
          DEMO: ${{ inputs.demo && '--demo' || '' }}
        run: python -m src.run --semana "$SEMANA" $FORZAR $DEMO

      - name: Revisar semanas con precios del I3 pendientes
        # si REE publicó algún día del I3 sin precios, la semana se rehace sola cuando los complete
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
        run: python -m src.run --semana pendientes

      - name: Enviar PDF por correo (opcional)
        if: steps.gen.outputs.pdf != ''
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m src.enviar "${{ steps.gen.outputs.pdf }}"

      - name: Guardar PDF como archivo descargable
        if: steps.gen.outputs.pdf != ''
        uses: actions/upload-artifact@v4
        with:
          name: informe-pdf
          path: ${{ steps.gen.outputs.pdf }}

      - name: Publicar en el repositorio
        if: ${{ always() }}
        run: |
          git config user.name "informe-bot"
          git config user.email "informe-bot@users.noreply.github.com"
          git add docs data
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Informe automático $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "Reintento del push ($i)…"; sleep 10
            done
          fi
