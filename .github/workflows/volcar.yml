name: Volcar indicadores

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  volcar:
    runs-on: ubuntu-24.04   # misma imagen que el informe semanal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Volcar lista completa de indicadores de ESIOS
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
        run: python -m src.volcar
      - name: Guardar en el repositorio
        run: |
          git config user.name "informe-bot"
          git config user.email "informe-bot@users.noreply.github.com"
          git add data/indicadores_esios.csv
          git diff --staged --quiet || (git commit -m "Lista de indicadores ESIOS" && git push)
