name: Descubrir indicadores

on:
  workflow_dispatch:
    inputs:
      texto:
        description: "Palabra a buscar en los nombres de los indicadores (p. ej. fotovoltaica)"
        required: true

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
          TEXTO: ${{ inputs.texto }}
        run: python -m src.descubrir "$TEXTO"
