name: I3 histórico (una vez)

# Descarga el I3 desde 2025-01-01 para tener el "año a año" de la Operación Reforzada.
# Cada ejecución procesa hasta 800 días (guarda cada 60); vuelve a lanzarlo si queda algo pendiente.
on:
  workflow_dispatch:
    inputs:
      desde:
        default: "2025-01-01"

permissions:
  contents: write

concurrency:
  group: informe
  cancel-in-progress: false

jobs:
  i3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar I3
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
          DESDE: ${{ inputs.desde }}
        run: python -m src.i3 --backfill "$DESDE" --maxdias 800
      - name: Guardar
        run: |
          git config user.name "informe-bot"
          git config user.email "informe-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "I3 histórico" && git push)
