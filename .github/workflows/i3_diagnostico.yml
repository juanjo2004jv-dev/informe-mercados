name: I3 diagnóstico (una vez)

# Descarga UN día de I3 y guarda cómo es por dentro (data/i3_estructura.txt).
# Pásame ese archivo y ajusto src/i3_mapa.yml si hace falta.
on:
  workflow_dispatch:
    inputs:
      dia:
        description: "Día AAAA-MM-DD (de hace al menos 5 días)"
        required: true

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
          DIA: ${{ inputs.dia }}
        run: python -m src.i3 --diagnostico "$DIA"
      - run: |
          git config user.name "informe-bot"
          git config user.email "informe-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Diagnóstico I3" && git push)
