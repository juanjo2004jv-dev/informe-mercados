name: Simulador BESS

# Aislado del informe semanal: solo escribe en data/simulador/ y docs/simulador/.
# Comparte el grupo de concurrencia "informe" para no chocar con sus commits.
on:
  workflow_dispatch:
    inputs:
      accion:
        description: "descargar | simular | validar | informe | todo"
        default: todo
      desde:
        description: "Inicio (AAAA-MM-DD)"
        default: "2026-07-01"
      hasta:
        description: "Fin exclusivo (AAAA-MM-DD)"
        default: "2026-10-01"
      escenarios:
        description: "Escenarios (simulador/escenarios/*.yml); vacío = todos"
        default: ""
  schedule:
    # Día 6 de cada mes, 05:37 UTC: mes anterior completo. (En este repositorio GitHub no dispara los
    # cron con fiabilidad; si no sale, se lanza a mano o desde el reloj.)
    - cron: "37 5 6 * *"

permissions:
  contents: write

concurrency:
  group: informe
  cancel-in-progress: false

jobs:
  simulador:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: "1"
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r simulador/requirements.txt pytest
      - name: Parámetros de la ejecución
        id: p
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ACCION=todo
            DESDE=$(date -d "$(date +%Y-%m-01) -1 month" +%Y-%m-01)
            HASTA=$(date +%Y-%m-01)
            ESC=""
          else
            ACCION="${{ inputs.accion }}"; DESDE="${{ inputs.desde }}"; HASTA="${{ inputs.hasta }}"; ESC="${{ inputs.escenarios }}"
          fi
          if [ -z "$ESC" ]; then ESC=$(ls simulador/escenarios/*.yml | xargs -n1 basename | sed 's/\.yml$//' | paste -sd, -); fi
          echo "accion=$ACCION" >> "$GITHUB_OUTPUT"; echo "desde=$DESDE" >> "$GITHUB_OUTPUT"
          echo "hasta=$HASTA" >> "$GITHUB_OUTPUT"; echo "esc=$ESC" >> "$GITHUB_OUTPUT"
          echo "Acción $ACCION · $DESDE..$HASTA · $ESC"
      - name: Pruebas del motor
        run: python -m pytest -q simulador/tests
      - name: Descargar datos de ESIOS
        if: steps.p.outputs.accion == 'descargar' || steps.p.outputs.accion == 'todo'
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
        run: |
          D=$(date -d "${{ steps.p.outputs.desde }}" +%Y-%m)
          H=$(date -d "${{ steps.p.outputs.hasta }} -1 day" +%Y-%m)
          python -m simulador.run descargar --desde "$D" --hasta "$H"
      - name: Simular escenarios
        if: steps.p.outputs.accion == 'simular' || steps.p.outputs.accion == 'todo'
        run: python -m simulador.run simular --escenarios "${{ steps.p.outputs.esc }}" --desde "${{ steps.p.outputs.desde }}" --hasta "${{ steps.p.outputs.hasta }}"
      - name: Validar contra referencias públicas
        if: steps.p.outputs.accion != 'descargar'
        run: python -m simulador.run validar
      - name: Informe del simulador (PDF y web)
        if: steps.p.outputs.accion != 'descargar'
        run: python -m simulador.run informe
      - name: Guarda de rutas (no tocar nada fuera del simulador)
        if: ${{ !cancelled() }}
        run: |
          FUERA=$(git status --porcelain | awk '{print $2}' | grep -vE '^(data/simulador/|docs/simulador/)' || true)
          if [ -n "$FUERA" ]; then echo "::error::El simulador ha modificado rutas ajenas: $FUERA"; exit 1; fi
      - name: Guardar resultados
        if: ${{ !cancelled() }}
        run: |
          git config user.name "simulador-bot"
          git config user.email "simulador-bot@users.noreply.github.com"
          [ -d data/simulador ] && git add data/simulador
          [ -d docs/simulador ] && git add docs/simulador
          git diff --staged --quiet && exit 0
          git commit -m "Simulador BESS: ${{ steps.p.outputs.accion }} ${{ steps.p.outputs.desde }}..${{ steps.p.outputs.hasta }}"
          # Otra ejecución puede haber subido antes: se rebasa dando prioridad a lo recién generado (en un rebase,
          # -X theirs es el commit propio; PDF, PNG y tablas se regeneran con todos los resultados) y, si al final
          # no se ha podido subir, el paso falla en vez de perder los resultados en silencio.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs --autostash && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "::error::No se han podido subir los resultados tras 5 intentos"; exit 1
