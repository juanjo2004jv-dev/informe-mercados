name: Histórico semanal (una vez)

# Reconstruye data/historico_semanal.csv (precio, techo de arbitraje 1/2/4 h, spread, horas <= 0,
# captura solar y eólica...) para las semanas que falten desde la fecha indicada. El informe semanal
# añade cada semana su fila solo; esto es para rellenar el pasado de una vez.
on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Primer lunes AAAA-MM-DD"
        default: "2025-01-06"

permissions:
  contents: write

concurrency:
  group: informe
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
          DESDE: ${{ inputs.desde }}
        run: python -m src.historico --desde "$DESDE"
      - run: |
          git config user.name "informe-bot"
          git config user.email "informe-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Histórico semanal" && (git pull --rebase --autostash; git push))
